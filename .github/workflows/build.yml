name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            image: debian:12
            artifact: taskbarplant-linux-x86_64
          - platform: linux/386
            image: i386/debian:12
            artifact: taskbarplant-linux-i686
          - platform: linux/arm64
            image: arm64v8/debian:12
            artifact: taskbarplant-linux-aarch64
          - platform: linux/arm/v7
            image: arm32v7/debian:12
            artifact: taskbarplant-linux-armv7

    steps:
      - uses: actions/checkout@v5

      # arm64 / armv7 / i386 在 x86 runner 上要靠 QEMU 才能执行
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 容器内编译
        # 在 Debian 12 里编，而不是宿主机：glibc 2.36 / Qt 6.4，兼容面最大。
        # 产物直接写到挂载点，容器退出后还在。
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/src -w /src \
            ${{ matrix.image }} \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake qt6-base-dev libx11-dev libxext-dev
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
              cmake --build build -j"$(nproc)"
              strip build/taskbarplant
              cp build/taskbarplant /src/${{ matrix.artifact }}
              echo "--- 产物 ---"
              file /src/${{ matrix.artifact }}
              echo "--- 架构 ---"
              uname -m
              echo "--- glibc 要求 ---"
              objdump -T /src/${{ matrix.artifact }} | grep -oP "GLIBC_[0-9.]+" | sort -uV | tail -3
            '

      - name: 产物确认
        run: |
          ls -la ${{ matrix.artifact }}
          test -f ${{ matrix.artifact }} || { echo "::error::没有产物"; exit 1; }
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # 打 v* tag 时才发版：把所有架构收齐再一起挂上去
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 收到的产物
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
