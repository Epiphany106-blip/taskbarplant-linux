name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Debian 12: glibc 2.36 + Qt 6.4.2
    # 比在滚动发行版上编译兼容得多 —— 本地 Tumbleweed 编出来的要 glibc 2.43，
    # 除了 Tumbleweed 谁也跑不了。
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: 安装依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates \
            qt6-base-dev libx11-dev libxext-dev

      - uses: actions/checkout@v4

      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build -j"$(nproc)"

      - name: 检查
        run: |
          ./build/taskbarplant --version
          echo "--- glibc 要求 ---"
          objdump -T build/taskbarplant | grep -oP 'GLIBC_[0-9.]+' | sort -uV | tail -3

      - name: 精简
        run: |
          strip build/taskbarplant
          mv build/taskbarplant taskbarplant-linux-x86_64
          ls -la taskbarplant-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: taskbarplant-linux-x86_64
          path: taskbarplant-linux-x86_64

      # 打 v* tag 时自动发 Release
      - name: 发布
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: taskbarplant-linux-x86_64
