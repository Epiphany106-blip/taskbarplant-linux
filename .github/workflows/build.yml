name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: taskbarplant-linux-x86_64
          - platform: linux/386
            artifact: taskbarplant-linux-i686
          - platform: linux/arm64
            artifact: taskbarplant-linux-aarch64
          - platform: linux/arm/v7
            artifact: taskbarplant-linux-armv7

    steps:
      - uses: actions/checkout@v5

      # arm64 / armv7 在 x86 runner 上要靠 QEMU 才能执行
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 容器内编译
        # ① 统一用 debian:12 —— 它是 multi-arch 镜像，i386 / armv7 / arm64 都在里面，
        #    不需要 i386/debian:12 那种前缀镜像（那个标签不存在）。
        # ② 不调用 file(1)，精简镜像里没装；用 objdump + uname 代替。
        # ③ chmod 也在容器里做 —— 容器内 root 建的文件，runner 用户改不动权限。
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/src -w /src \
            debian:12 \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake qt6-base-dev libx11-dev libxext-dev
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
              cmake --build build -j"$(nproc)"
              strip build/taskbarplant
              cp build/taskbarplant /src/${{ matrix.artifact }}
              chmod 755 /src/${{ matrix.artifact }}

              echo "--- 架构 ---"; uname -m
              echo "--- 大小 ---"; ls -la /src/${{ matrix.artifact }}
              echo "--- 文件头 ---"; head -c 20 /src/${{ matrix.artifact }} | od -An -tx1 | head -2
              echo "--- glibc 要求 ---"
              objdump -T /src/${{ matrix.artifact }} | grep -oP "GLIBC_[0-9.]+" | sort -uV | tail -3
            '

      - name: 产物确认
        run: |
          test -f ${{ matrix.artifact }} || { echo "::error::没有产物"; exit 1; }
          ls -la ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # 打 v* tag 时才发版：四个架构全部收齐再一起挂上去
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 收到的产物
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
