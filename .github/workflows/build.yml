name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 同一个 ref 只保留最新一次运行，避免连续推送时排队堆积。
# tag 与 main 是不同的 ref，不会互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  #  x86_64：每次提交都编。这是"能不能过"的快速信号，一分钟左右。
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            artifact: taskbarplant-linux-x86_64
    steps: &build-steps
      - uses: actions/checkout@v5

      # arm 架构在 x86 runner 上要靠 QEMU 才能执行
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: 容器内编译
        # ① 统一用 debian:12 —— 它是 multi-arch 镜像，armv7 / arm64 都在里面，
        #    不需要 arm32v7/debian:12 那种前缀镜像（那个标签不存在）。
        # ② 不调用 file(1)，精简镜像里没装；用 objdump + uname 代替。
        # ③ chmod 也在容器里做 —— 容器内 root 建的文件，runner 用户改不动权限。
        # ④ 不构建 linux/386：那个容器里 Docker 的 DNS 解析不动，加 --network host
        #    和覆盖 resolv.conf 都没解决。i686 用户请从源码编译。
        #
        #  版本号：tag 构建时把 ref_name 显式传进去。容器里没有 git，
        #  只靠 `git describe` 探测的话每个发布版都会变成 -canary。
        #  传进去之后还要在容器里实跑一次 --version 核对 —— 编译参数对不对
        #  不能靠"应该没问题"，得让二进制自己说话。
        env:
          TBP_REF: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD":/src -w /src \
            -e TBP_REF="$TBP_REF" \
            debian:12 \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential cmake qt6-base-dev libx11-dev libxext-dev
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DTBP_VERSION_OVERRIDE="$TBP_REF"
              cmake --build build -j"$(nproc)"

              # 版本号自检：tag 构建不允许出现 canary
              # 必须带 offscreen：容器里没有 X，QApplication 加载 xcb 插件失败会直接 abort
              VER=$(QT_QPA_PLATFORM=offscreen ./build/taskbarplant --version 2>/dev/null | tail -1 || true)
              echo "--- 版本 ---"
              echo "$VER"
              # 整行精确比较，不用子串匹配 —— grep -F "1.3.0-rc.2" 会误中 "1.3.0-rc.20"
              WANT="TaskbarPlant v${TBP_REF#v}"
              case "$TBP_REF" in
                v*)
                  if [ "$VER" != "$WANT" ]; then
                    echo "::error::版本不符，期望 '$WANT'，实际 '$VER'"
                    exit 1
                  fi
                  ;;
              esac

              strip build/taskbarplant
              cp build/taskbarplant /src/${{ matrix.artifact }}
              chmod 755 /src/${{ matrix.artifact }}

              echo "--- 架构 ---"; uname -m
              echo "--- 大小 ---"; ls -la /src/${{ matrix.artifact }}
              echo "--- 文件头 ---"; head -c 20 /src/${{ matrix.artifact }} | od -An -tx1 | head -2
              echo "--- glibc 要求 ---"
              objdump -T /src/${{ matrix.artifact }} | grep -oP "GLIBC_[0-9.]+" | sort -uV | tail -3
            '

      - name: 产物确认
        run: |
          test -f ${{ matrix.artifact }} || { echo "::error::没有产物"; exit 1; }
          ls -la ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # ---------------------------------------------------------------------------
  #  ARM：只在打 tag 时编。两个架构都跑在 QEMU 下，各要几分钟，
  #  平时提交编它纯属浪费 —— 只有发版才需要这两个二进制。
  # ---------------------------------------------------------------------------
  build-arm:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            artifact: taskbarplant-linux-aarch64
          - platform: linux/arm/v7
            artifact: taskbarplant-linux-armv7
    steps: *build-steps

  # ---------------------------------------------------------------------------
  #  发版：三个架构收齐再一起挂上去
  # ---------------------------------------------------------------------------
  release:
    needs: [build, build-arm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 收到的产物
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
